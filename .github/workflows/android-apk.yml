name: Compilar APK del Kiosco

# Se ejecuta al subir cambios a main, o manualmente desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la web (export estático)
        run: npm run build

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Compilar el APK (debug, instalable)
        working-directory: web-admin/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: kiosco-apk
          path: web-admin/android/app/build/outputs/apk/debug/app-debug.apk
