name: Compilar APK del Kiosco

# Se ejecuta al subir cambios a main, o manualmente desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar componentes de Android (SDK 36)
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la web (export estático)
        run: npm run build

      - name: Copiar la web al proyecto Android (manual)
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -r out/. android/app/src/main/assets/public/
          printf '%s' '{"appId":"com.gueguense.kiosco","appName":"Kiosco","webDir":"out","android":{"backgroundColor":"#0C1310"}}' > android/app/src/main/assets/capacitor.config.json
          printf '%s' '[]' > android/app/src/main/assets/capacitor.plugins.json

      - name: Compilar el APK (debug, instalable)
        working-directory: web-admin/android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir el APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: kiosco-apk
          path: web-admin/android/app/build/outputs/apk/debug/app-debug.apk
